# =============================================================================
# VERSION MANAGEMENT
# =============================================================================
# To bump version: rename this file
#   - Patch: Automatic via github.run_number (resets on major/minor bump)
#   - Minor: build-v1.0.yml -> build-v1.1.yml
#   - Major: build-v1.1.yml -> build-v2.0.yml
# =============================================================================

name: Build and Release Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  set_version:
    name: Set Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.full_version }}
      version_prefix: ${{ steps.extract_version.outputs.version_prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from workflow filename
        id: extract_version
        run: |
          # GITHUB_WORKFLOW contains the workflow name, not the filename
          # GITHUB_WORKFLOW_REF contains: {owner}/{repo}/.github/workflows/{filename}@{ref}
          # Extract the filename from the ref
          WORKFLOW_REF="${{ github.workflow_ref }}"
          WORKFLOW_FILENAME=$(echo "$WORKFLOW_REF" | sed -n 's|.*/\(build-v[0-9]\+\.[0-9]\+\.yml\)@.*|\1|p')

          echo "Workflow ref: $WORKFLOW_REF"
          echo "Extracted filename: $WORKFLOW_FILENAME"

          VERSION_PREFIX=$(echo "$WORKFLOW_FILENAME" | sed -n 's/.*build-v\([0-9]\+\.[0-9]\+\)\.yml.*/\1/p')

          if [ -z "$VERSION_PREFIX" ]; then
            echo "Error: Could not extract version from workflow ref: $WORKFLOW_REF"
            exit 1
          fi

          BUILD_NUMBER=${{ github.run_number }}
          FULL_VERSION="$VERSION_PREFIX.$BUILD_NUMBER"

          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            FULL_VERSION="$FULL_VERSION-preview"
          fi

          echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "Version: $FULL_VERSION"

  build_rider:
    needs: set_version
    runs-on: ubuntu-latest
    env:
      RIDER_VERSION: "2024.3"
      PLUGIN_VERSION: ${{ needs.set_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2
          cache-read-only: false

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-rider-${{ env.RIDER_VERSION }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-rider-${{ env.RIDER_VERSION }}-
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle wrapper is executable
        run: |
          chmod +x Rider/gradlew
          sed -i 's/\r$//' Rider/gradlew

      - name: Warm IntelliJ Platform cache
        run: cd Rider && ./gradlew setupDependencies --no-daemon --stacktrace
        timeout-minutes: 25

      - name: Run Rider plugin tests
        run: cd Rider && ./gradlew test --no-daemon --stacktrace
        timeout-minutes: 10
        env:
          E2E_REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/empowerfinance/TiltPromptLibraryE2ETestRepo.git

      - name: Generate test report
        if: always()
        run: cd Rider && ./gradlew jacocoTestReport --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rider-test-results-${{ env.PLUGIN_VERSION }}
          path: |
            Rider/build/reports/tests/
            Rider/build/test-results/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rider-coverage-report-${{ env.PLUGIN_VERSION }}
          path: Rider/build/reports/jacoco/
          retention-days: 30

      - name: Build Rider plugin
        run: cd Rider && ./gradlew buildPlugin --no-daemon --stacktrace -PpluginVersion=${{ env.PLUGIN_VERSION }}

      - name: Rename Rider artifact
        run: |
          mv Rider/build/distributions/*.zip Rider/build/distributions/TiltPromptLibraryPlugin-${{ env.PLUGIN_VERSION }}.zip

      - name: Upload Rider plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: rider-plugin-${{ env.PLUGIN_VERSION }}
          path: Rider/build/distributions/TiltPromptLibraryPlugin-${{ env.PLUGIN_VERSION }}.zip
          retention-days: 30

  build_vscode:
    needs: set_version
    runs-on: ubuntu-latest
    env:
      EXT_VERSION: ${{ needs.set_version.outputs.version }}
    defaults:
      run:
        working-directory: VSCode
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.18.1
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"

      - name: Setup npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('VSCode/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          E2E_REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/empowerfinance/TiltPromptLibraryE2ETestRepo.git

      - name: Set package version
        run: npm version --no-git-tag-version ${{ env.EXT_VERSION }}

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce package -o "Tilt-Prompt-Library-${{ env.EXT_VERSION }}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ env.EXT_VERSION }}
          path: VSCode/Tilt-Prompt-Library-${{ env.EXT_VERSION }}.vsix
          retention-days: 30

  release:
    needs: [set_version, build_rider, build_vscode]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.set_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Rider artifact
        uses: actions/download-artifact@v4
        with:
          name: rider-plugin-${{ env.VERSION }}
          path: ./artifacts/rider

      - name: Download VS Code artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension-${{ env.VERSION }}
          path: ./artifacts/vscode

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: "Tilt Prompt Library Plugins v${{ env.VERSION }}"
          body: |
            ## Tilt Prompt Library Plugins v${{ env.VERSION }}

            ### Downloads
            - **Rider Plugin**: `TiltPromptLibraryPlugin-${{ env.VERSION }}.zip`
            - **VS Code Extension**: `Tilt-Prompt-Library-${{ env.VERSION }}.vsix`

            ### Installation
            - **Rider**: File > Settings > Plugins > Install Plugin from Disk...
            - **VS Code**: Extensions > ... > Install from VSIX...
          files: |
            ./artifacts/**/*.zip
            ./artifacts/**/*.vsix
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
