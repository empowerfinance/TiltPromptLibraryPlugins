name: Build and Release VS Code Extension

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VSCode
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('VSCode/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Set extension version from run number
        run: |
          echo "EXT_VERSION=0.1.${{ github.run_number }}" >> $GITHUB_ENV
          echo "Using version 0.1.${{ github.run_number }}"
          npm version --no-git-tag-version $EXT_VERSION

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce package -o prompt-library-${{ env.EXT_VERSION }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ env.EXT_VERSION }}
          path: VSCode/prompt-library-${{ env.EXT_VERSION }}.vsix
          retention-days: 30

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version and tag
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          echo "EXT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_TAG=vsc-v$VERSION" >> $GITHUB_ENV

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension-${{ env.EXT_VERSION }}
          path: ./artifacts

      - name: Create VS Code Extension Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "VS Code Prompt Library v${{ env.EXT_VERSION }}"
          files: ./artifacts/*.vsix
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace (if token provided)
        if: ${{ secrets.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish -p ${{ secrets.VSCE_PAT }} --packagePath ./artifacts/*.vsix

