name: Build and Release VS Code Extension

on:
  push:
    branches: [ main ]
    tags:
      - vsc-v*
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VSCode
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('VSCode/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Set extension version from tag or run number
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == vsc-v* ]]; then
            echo "EXT_VERSION=${GITHUB_REF_NAME#vsc-v}" >> $GITHUB_ENV
            echo "Detected tag version: ${GITHUB_REF_NAME#vsc-v}"
          else
            echo "EXT_VERSION=0.1.${{ github.run_number }}" >> $GITHUB_ENV
            echo "Fallback version: 0.1.${{ github.run_number }}"
          fi
          npm version --no-git-tag-version $EXT_VERSION

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce package -o prompt-library-${{ env.EXT_VERSION }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ env.EXT_VERSION }}
          path: VSCode/prompt-library-${{ env.EXT_VERSION }}.vsix
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/vsc-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version from tag (release)
        run: echo "EXT_VERSION=${GITHUB_REF_NAME#vsc-v}" >> $GITHUB_ENV

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension-${{ env.EXT_VERSION }}
          path: ./artifacts

      - name: Create VS Code Extension Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "VS Code Prompt Library v${{ env.EXT_VERSION }}"
          body: |
            # VS Code Prompt Library v${{ env.EXT_VERSION }}

            Auto-generated release from build #${{ github.run_number }}.

            Download the .vsix below and install via "Extensions: Install from VSIX..." in VS Code.
          files: ./artifacts/*.vsix
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace (if token provided)
        if: ${{ secrets.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish -p ${{ secrets.VSCE_PAT }} --packagePath ./artifacts/*.vsix

