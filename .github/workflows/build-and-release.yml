name: Build and Release Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RIDER_VERSION: '2024.3'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.10.2
        cache-read-only: false

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-rider-${{ env.RIDER_VERSION }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-rider-${{ env.RIDER_VERSION }}-
          ${{ runner.os }}-gradle-

    - name: Set version from run number
      run: |
        echo "PLUGIN_VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV
        echo "Building version: 1.0.${{ github.run_number }}"


    - name: Ensure Gradle wrapper is executable
      run: |
        chmod +x ./gradlew
        sed -i 's/\r$//' ./gradlew

    - name: Warm IntelliJ Platform cache
      run: ./gradlew setupDependencies --no-daemon --stacktrace
      timeout-minutes: 25

    - name: Update plugin version in build.gradle.kts
      run: |
        sed -i "s/version = \".*\"/version = \"${{ env.PLUGIN_VERSION }}\"/" build.gradle.kts || echo "version = \"${{ env.PLUGIN_VERSION }}\"" >> build.gradle.kts

    - name: Build plugin
      run: ./gradlew buildPlugin --no-daemon --stacktrace

    - name: Verify plugin artifact
      run: |
        ls -la build/distributions/
        echo "Plugin built successfully"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: plugin-distribution-${{ env.PLUGIN_VERSION }}
        path: build/distributions/*.zip
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set version from run number
      run: |
        echo "PLUGIN_VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV
        echo "RELEASE_TAG=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: plugin-distribution-${{ env.PLUGIN_VERSION }}
        path: ./artifacts

    - name: Create Release Notes
      run: |
        cat > release_notes.md << EOF
        # Rider Prompt Library Plugin v${{ env.PLUGIN_VERSION }}

        **Auto-generated release from build #${{ github.run_number }}**

        ## 🚀 Installation

        1. Download the \`Prompt-Library-${{ env.PLUGIN_VERSION }}.zip\` file below
        2. In JetBrains Rider: **File > Settings > Plugins > ⚙️ > Install Plugin from Disk...**
        3. Select the downloaded zip file
        4. Restart Rider

        ## ✨ Features

        - 📝 Create, edit, and delete prompts with confirmation dialogs
        - 📋 One-click copy - click any prompt to copy it to clipboard
        - 🔍 Real-time search with case-insensitive filtering
        - 📤 Import/Export prompts as clean JSON arrays
        - 🚫 Duplicate detection - automatically prevents duplicate prompts
        - 💾 Persistent storage - prompts survive IDE restarts
        - 🎨 Theme-aware UI - adapts to light/dark Rider themes

        ## 🔧 Requirements

        - JetBrains Rider 2024.1 or newer
        - Windows, macOS, or Linux

        ## 📋 Usage

        After installation, look for "Prompt Library" in the left sidebar tool windows.

        ---

        **Commit:** \`${{ github.sha }}\`
        **Build:** #${{ github.run_number }}
        **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: "Prompt Library Plugin v${{ env.PLUGIN_VERSION }}"
        body_path: release_notes.md
        files: ./artifacts/*.zip
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update README with latest version
      run: |
        sed -i "s/Prompt-Library-\*\.zip/Prompt-Library-${{ env.PLUGIN_VERSION }}.zip/g" README.md
        sed -i "s/version [0-9]\+\.[0-9]\+\.[0-9]\+/version ${{ env.PLUGIN_VERSION }}/g" README.md

    - name: Commit version updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md build.gradle.kts
        git diff --staged --quiet || git commit -m "🚀 Release v${{ env.PLUGIN_VERSION }} [skip ci]"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
