name: Build and Release Plugin

on:
  push:
    branches: [ main ]
    tags:
      - rider-v*
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RIDER_VERSION: '2024.3'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.10.2
        cache-read-only: false

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-rider-${{ env.RIDER_VERSION }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-rider-${{ env.RIDER_VERSION }}-
          ${{ runner.os }}-gradle-

    - name: Set version from tag or run number
      run: |
        if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == rider-v* ]]; then
          echo "PLUGIN_VERSION=${GITHUB_REF_NAME#rider-v}" >> $GITHUB_ENV
          echo "Detected tag version: ${GITHUB_REF_NAME#rider-v}"
        else
          echo "PLUGIN_VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV
          echo "Fallback version: 1.0.${{ github.run_number }}"
        fi


    - name: Ensure Gradle wrapper is executable
      run: |
        chmod +x Rider/gradlew
        sed -i 's/\r$//' Rider/gradlew

    - name: Warm IntelliJ Platform cache
      run: cd Rider && ./gradlew setupDependencies --no-daemon --stacktrace
      timeout-minutes: 25

    - name: Prepare plugin version
      run: echo "Using -PpluginVersion=${{ env.PLUGIN_VERSION }} for build"

    - name: Build plugin
      run: cd Rider && ./gradlew buildPlugin --no-daemon --stacktrace -PpluginVersion=${{ env.PLUGIN_VERSION }}

    - name: Verify plugin artifact
      run: |
        ls -la Rider/build/distributions/
        echo "Plugin built successfully"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: plugin-distribution-${{ env.PLUGIN_VERSION }}
        path: Rider/build/distributions/*.zip
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/rider-v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set version from tag
      run: |
        echo "PLUGIN_VERSION=${GITHUB_REF_NAME#rider-v}" >> $GITHUB_ENV
        echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: plugin-distribution-${{ env.PLUGIN_VERSION }}
        path: ./artifacts

    - name: Create Release Notes
      run: |
        cat > release_notes.md << EOF
        # Rider Prompt Library Plugin v${{ env.PLUGIN_VERSION }}

        **Auto-generated release from build #${{ github.run_number }}**

        ## 🚀 Installation

        1. Download the \`Prompt-Library-${{ env.PLUGIN_VERSION }}.zip\` file below
        2. In JetBrains Rider: **File > Settings > Plugins > ⚙️ > Install Plugin from Disk...**
        3. Select the downloaded zip file
        4. Restart Rider

        ## ✨ Features

        - 📝 Create, edit, and delete prompts with confirmation dialogs
        - 📋 One-click copy - click any prompt to copy it to clipboard
        - 🔍 Real-time search with case-insensitive filtering
        - 📤 Import/Export prompts as clean JSON arrays
        - 🚫 Duplicate detection - automatically prevents duplicate prompts
        - 💾 Persistent storage - prompts survive IDE restarts
        - 🎨 Theme-aware UI - adapts to light/dark Rider themes

        ## 🔧 Requirements

        - JetBrains Rider 2024.1 or newer
        - Windows, macOS, or Linux

        ## 📋 Usage

        After installation, look for "Prompt Library" in the left sidebar tool windows.

        ---

        **Commit:** \`${{ github.sha }}\`
        **Build:** #${{ github.run_number }}
        **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "Rider Prompt Library v${{ env.PLUGIN_VERSION }}"
        body_path: release_notes.md
        files: ./artifacts/*.zip
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Skipping README/version commits; release notes include version. If needed, update Rider/README.md explicitly in the future.
