name: 🐛 Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      description: Which plugin are you using?
      options:
        - VS Code Extension
        - Rider Plugin
        - Both
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin Version
      description: What version of the plugin are you using?
      placeholder: "e.g., 0.0.42"
    validations:
      required: true

  - type: input
    id: ide-version
    attributes:
      label: IDE Version
      description: What version of VS Code or Rider are you using?
      placeholder: "e.g., VS Code 1.95.0 or Rider 2025.2"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Open the Prompt Library panel
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Messages
      description: |
        If applicable, paste any error messages or logs.
        - VS Code: Help → Toggle Developer Tools → Console
        - Rider: Help → Diagnostic Tools → Show Log in Explorer
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or information about the problem.

