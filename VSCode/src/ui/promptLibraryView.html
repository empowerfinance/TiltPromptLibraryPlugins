<!DOCTYPE html>
<html>

<head>
  {{CSP}}
  <style>
    :root {
      --accent: var(--vscode-focusBorder);
      --card-bg: var(--vscode-editorWidget-background);
      --panel-bg: var(--vscode-sideBar-background);
      --border: var(--vscode-widget-border);
      --muted: var(--vscode-descriptionForeground);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--vscode-font-family);
      color: var(--vscode-foreground);
      background: transparent;
      margin: 0;
      line-height: 1.5;
    }

    .container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h3.title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .2px;
      margin: 0 0 4px 0;
    }

    .muted {
      color: var(--muted);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 1px 0 rgba(0, 0, 0, .2), 0 8px 24px rgba(0, 0, 0, .08);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar .spacer {
      flex: 1;
    }


    .headerRow {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .headerRow .leftCol {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .headerRow .rightCol {
      display: flex;
      align-items: flex-start;
    }

    .btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--vscode-foreground);
      cursor: pointer;
      transition: background .15s ease, transform .02s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn[disabled] {
      opacity: .6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--vscode-button-foreground, #000);
      border-color: var(--accent);
      box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }

    .btn-primary:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, .08), 0 0 0 3px var(--accent);
    }

    input[type="text"],
    textarea {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--vscode-input-background);
      color: var(--vscode-input-foreground, var(--vscode-foreground));
      padding: 10px 12px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    input[type="text"]::placeholder,
    textarea::placeholder {
      color: var(--muted);
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.02);
      transition: background .15s ease, border-color .15s ease;
    }

    .item:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--accent);
    }

    .summary {
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }

    .summary:hover {
      text-decoration: underline;
    }

    .tags {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--vscode-foreground);
      border: 1px solid var(--border);
    }

    .rowActions {
      margin-left: auto;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #boot {
      position: sticky;
      top: 0;
      font-size: 11px;
      opacity: .5;
      padding: 4px 8px;
    }
  </style>
</head>

<body>
  <div id="boot" style="display:none;">booting…</div>
  <div class="container">
    <div class="card">
      <div id="sel" class="muted" style="margin-bottom:12px;">Loading…</div>
      <div class="toolbar" style="margin-bottom:12px;">
        <span id="counts" class="count"></span>
        <div class="spacer"></div>
      </div>
      <label for="titleBox" class="muted" style="display:block;margin-bottom:6px;">Title (optional)</label>
      <input id="titleBox" type="text" placeholder="Defaults to first 20 characters of the prompt" disabled />
      <div style="height:8px;"></div>
      <textarea id="composer" rows="8" placeholder="Select a prompt to view or edit, or select a group to add new" disabled></textarea>
      <div style="height:10px;"></div>
      <div class="toolbar" style="gap:8px; padding:0;">
        <button id="addNew" class="btn" disabled>Add New</button>
        <div class="spacer"></div>
        <button id="save" class="btn btn-primary" disabled>Add Prompt</button>
        <button id="cancelEdit" class="btn" style="display:none;">Cancel</button>
      </div>
    </div>
  </div>

  <script nonce="{{NONCE}}">
    (function () {
      // ---- Boot diagnostics & error bridge ----
      const vscode = acquireVsCodeApi?.();
      const boot = document.getElementById('boot');
      // Boot element is hidden, no need to update text
      window.onerror = function (message, source, lineno, colno, error) {
        try { vscode?.postMessage({ type: 'wv-log', msg: 'ERR: ' + String(message) }); } catch { }
      };

      const sel = document.getElementById('sel');
      const filter = document.getElementById('filter');
      try {
        filter?.setAttribute('disabled', 'true');
        document.getElementById('clearFilter')?.setAttribute('disabled', 'true');
        filter?.parentElement?.setAttribute('style', 'display:none;');
      } catch { }
      const list = document.getElementById('list');
      const composer = document.getElementById('composer');
      const save = document.getElementById('save');
      const titleBox = document.getElementById('titleBox');
      const counts = document.getElementById('counts');
      const cancelBtn = document.getElementById('cancelEdit');
      const addNewBtn = document.getElementById('addNew');

      // Mode: 'view', 'add', or 'edit'
      let currentMode = 'add';
      let editingId = null;
      let viewingId = null;

      // Track original values for change detection
      let originalTitle = '';
      let originalText = '';

      function first20(s) { return (String(s || '')).replace(/\r\n?|\n/g, ' ').slice(0, 20).trim(); }

      // Check if current values differ from original
      function hasChanges() {
        if (currentMode !== 'edit') return false;
        const currentTitle = titleBox?.value || '';
        const currentText = composer?.value || '';
        return currentTitle !== originalTitle || currentText !== originalText;
      }

      // Update save button state based on changes
      function updateSaveButton() {
        if (!save) return;
        if (currentMode === 'edit') {
          if (hasChanges()) {
            save.removeAttribute('disabled');
          } else {
            save.setAttribute('disabled', 'true');
          }
        } else if (currentMode === 'add') {
          // In add mode, enable if there's text
          if (composer?.value?.trim()) {
            save.removeAttribute('disabled');
          } else {
            save.setAttribute('disabled', 'true');
          }
        }
      }

      function setMode(mode, promptId = null) {
        currentMode = mode;

        if (mode === 'view') {
          viewingId = promptId;
          editingId = null;
          if (composer) composer.setAttribute('readonly', 'true');
          if (titleBox) titleBox.setAttribute('readonly', 'true');
          if (save) {
            save.textContent = 'Save Changes';
            save.style.display = 'inline-block';
          }
          if (cancelBtn) cancelBtn.style.display = 'inline-block';
          if (addNewBtn) {
            addNewBtn.style.display = 'inline-block';
            addNewBtn.removeAttribute('disabled');
          }
        } else if (mode === 'edit') {
          editingId = promptId;
          viewingId = null;
          if (composer) composer.removeAttribute('readonly');
          if (titleBox) titleBox.removeAttribute('readonly');
          if (save) {
            save.textContent = 'Save Changes';
            save.style.display = 'inline-block';
            // Initially disabled until changes are made
            save.setAttribute('disabled', 'true');
          }
          if (cancelBtn) cancelBtn.style.display = 'inline-block';
          if (addNewBtn) {
            addNewBtn.style.display = 'inline-block';
            addNewBtn.removeAttribute('disabled');
          }
        } else { // 'add'
          editingId = null;
          viewingId = null;
          if (composer) composer.removeAttribute('readonly');
          if (titleBox) titleBox.removeAttribute('readonly');
          if (save) {
            save.textContent = 'Add Prompt';
            save.style.display = 'inline-block';
          }
          if (cancelBtn) cancelBtn.style.display = 'none';
          // Hide "Add New" button when already in add mode
          if (addNewBtn) addNewBtn.style.display = 'none';
        }
      }

      // Optimistically enable inputs so they can receive focus immediately
      try {
        composer?.removeAttribute('disabled');
        save?.removeAttribute('disabled');
        titleBox?.removeAttribute('disabled');
      } catch { }

      // Auto-suggest title from first 20 chars if empty (only in add/edit mode)
      composer?.addEventListener('input', () => {
        if (!titleBox) return;
        if (currentMode === 'view') return; // Don't auto-suggest in view mode
        if (!titleBox.value || !titleBox.value.trim()) {
          titleBox.value = first20(composer.value || '');
        }
        // Update save button state when text changes
        updateSaveButton();
      });

      // Update save button state when title changes
      titleBox?.addEventListener('input', () => {
        updateSaveButton();
      });

      let allPrompts = [];
      try { vscode?.postMessage({ type: 'ready' }); vscode?.postMessage({ type: 'wv-log', msg: 'boot' }); } catch { }

      const selected = new Set();
      function summarize(text) {
        const first = (text || '').split(/\r?\n/, 1)[0];
        return first.length > 120 ? first.slice(0, 117) + '\u2026' : first;
      }
      function normalized(t) { return (t || '').replace(/\r\n|\r/g, '\n').replace(/\s+/g, ' ').trim().toLowerCase(); }
      function renderCounts(shown) { if (counts) counts.textContent = ''; }

      function renderSelectionBar() {
        const bulkbar = document.getElementById('bulkbar');
        const bulkcount = document.getElementById('bulkcount');
        const n = selected.size;
        if (!bulkbar || !bulkcount) return;
        if (n > 0) { bulkbar.style.display = 'flex'; bulkcount.textContent = n + ' selected'; }
        else { bulkbar.style.display = 'none'; }
      }

      function renderList(prompts) {
        if (!list) return;
        list.innerHTML = '';
        list.style.display = 'none';
        renderCounts(0);
        const bulkbar = document.getElementById('bulkbar'); if (bulkbar) bulkbar.style.display = 'none';
      }

      function applyFilter() { renderList(allPrompts); } // filtering disabled

      window.addEventListener('message', (event) => {
        const msg = event.data || {};
        try { vscode?.postMessage({ type: 'wv-log', msg: 'recv ' + String(msg.type) + (Array.isArray(msg.payload) ? (' len=' + msg.payload.length) : '') }); } catch { }
        if (msg.type === 'selectedGroup') {
          // Switch to add mode when selecting a group
          setMode('add');
          if (composer) composer.value = '';
          if (titleBox) titleBox.value = '';

          const g = msg.payload;
          if (!g || !g.id) {
            sel && (sel.textContent = 'No group selected');
            composer?.setAttribute('disabled', 'true');
            save?.setAttribute('disabled', 'true');
            titleBox?.setAttribute('disabled', 'true');
            addNewBtn?.setAttribute('disabled', 'true');
            composer && composer.setAttribute('placeholder', 'Select a group or prompt');
            allPrompts = [];
            renderList([]);
          } else {
            sel && (sel.textContent = 'Selected group: ' + (g.name || g.id));
            try { if (filter) filter.value = ''; } catch { }
            selected.clear(); renderSelectionBar();
            if (g.id === 'root-shared' || g.id === 'root-private') {
              composer?.setAttribute('disabled', 'true');
              save?.setAttribute('disabled', 'true');
              titleBox?.setAttribute('disabled', 'true');
              addNewBtn?.setAttribute('disabled', 'true');
              composer && composer.setAttribute('placeholder', 'Select a subgroup to add prompts');
            } else {
              composer?.removeAttribute('disabled');
              save?.removeAttribute('disabled');
              titleBox?.removeAttribute('disabled');
              composer && composer.setAttribute('placeholder', 'Write a new prompt for ' + (g.name || g.id) + '...');
            }
          }
        } else if (msg.type === 'prompts') {
          allPrompts = Array.isArray(msg.payload) ? msg.payload : [];
          try { vscode?.postMessage({ type: 'wv-log', msg: 'render prompts=' + allPrompts.length }); } catch { }
          applyFilter();
        } else if (msg.type === 'populateComposer') {
          const p = msg.payload || {};
          // Store original values for change detection
          originalTitle = String(p.title || '');
          originalText = String(p.text || '');

          if (titleBox) titleBox.value = originalTitle;
          if (composer) { composer.value = originalText; try { composer.focus(); } catch { } }
          // Enter edit mode (editable) when a prompt is selected
          setMode('edit', p.id);
        }
      });

      document.getElementById('bulkDelete')?.addEventListener('click', () => {
        if (selected.size === 0) return;
        vscode?.postMessage({ type: 'deleteMany', ids: Array.from(selected) });
        selected.clear(); renderSelectionBar();
      });
      document.getElementById('bulkMove')?.addEventListener('click', () => {
        if (selected.size === 0) return;
        vscode?.postMessage({ type: 'moveMany', ids: Array.from(selected) });
        selected.clear(); renderSelectionBar();
      });

      // Add New button - switch to add mode with empty fields
      addNewBtn?.addEventListener('click', () => {
        setMode('add');
        if (composer) composer.value = '';
        if (titleBox) titleBox.value = '';
        // Clear original values since we're in add mode
        originalTitle = '';
        originalText = '';
        updateSaveButton();
        try { composer?.focus(); } catch { }
      });

      // Save button - handles both add and edit
      save?.addEventListener('click', () => {
        const text = composer?.value || '';
        if (!text.trim()) return;
        const rawTitle = (titleBox && titleBox.value) ? titleBox.value.trim() : '';
        const fallback = first20(text);
        const title = rawTitle || fallback;

        if (currentMode === 'view') {
          // Switch from view to edit mode
          setMode('edit', viewingId);
        } else if (editingId) {
          // Save changes to existing prompt
          vscode?.postMessage({ type: 'editPrompt', id: editingId, text, title });
          // Update original values to reflect the save
          originalTitle = title;
          originalText = text;
          // Disable save button since there are no unsaved changes
          updateSaveButton();
          setMode('add');
          if (composer) composer.value = '';
          if (titleBox) titleBox.value = '';
          originalTitle = '';
          originalText = '';
        } else {
          // Add new prompt
          const seen = new Set(allPrompts.map(p => normalized(p.text)));
          if (seen.has(normalized(text))) { alert('Duplicate prompt'); return; }
          vscode?.postMessage({ type: 'addPrompt', text, title });
          if (composer) composer.value = '';
          if (titleBox) titleBox.value = '';
          originalTitle = '';
          originalText = '';
        }
        try { if (filter) filter.value = ''; } catch { };
      });

      // Cancel button - return to add mode
      cancelBtn?.addEventListener('click', () => {
        setMode('add');
        if (composer) composer.value = '';
        if (titleBox) titleBox.value = '';
        // Clear original values
        originalTitle = '';
        originalText = '';
        updateSaveButton();
        try { if (filter) filter.value = ''; } catch { };
      });

    })();
  </script>
</body>

</html>
